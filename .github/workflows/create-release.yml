on:
  push:
    tags:
      - "*"
      - "!*-nightly"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag
        required: true
        type: string

name: Create Release

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  build:
    name: Create Release
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Both release variants use the signing credentials stored in this environment.
    environment: nightly
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "Expected a stable version tag (YYYY.MM.BUILD)"
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@v4.2.1
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Set up Java
        uses: actions/setup-java@v4.4.0
        with:
          distribution: "zulu"
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        env:
          ENCODED_GOOGLE_SERVICES: ${{ secrets.ENCODED_GOOGLE_SERVICES }}
          ENCODED_RELEASE_KEYSTORE: ${{ secrets.ENCODED_RELEASE_KEYSTORE }}
          ENCODED_SECRETS_PROPERTIES: ${{ secrets.ENCODED_SECRETS_PROPERTIES }}
        run: make deploy-github-release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Meerkat Reader ${{ inputs.release_tag || github.ref_name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/free/release/app-free-release.apk
