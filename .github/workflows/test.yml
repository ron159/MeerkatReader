name: Unit tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Type-check JavaScript
        run: make check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.1
      - name: Set up Java
        uses: actions/setup-java@v4.4.0
        with:
          distribution: 'zulu'
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Run tests
        # Main keeps both variants; PRs run shared cases once and compile Gplay tests.
        run: bundle exec fastlane test single_flavor:${{ github.event_name == 'pull_request' }}
      - name: Test report
        uses: test-summary/action@v2
        if: always()
        with:
          paths: '**/build/test-results/**/TEST-*.xml'
